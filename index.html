<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غراوي للسياحة والسفر - نظام الحجز الذكي</title>
    <!-- استيراد الخط لضمان سرعة التحميل القصوى في دمشق -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            /* تصميم الخلفية الملكية المدمجة بألوان الهوية */
            background: linear-gradient(135deg, #0F203D 0%, #050B14 100%);
            color: #1E293B;
            padding: 20px 10px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .booking-container {
            width: 100%;
            max-width: 480px;
            background: #FFFFFF; 
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 2px solid #C5A880; /* إطار ذهبي فاخر */
        }

        /* الهيدر المعتمد لغراوي ترافل */
        .header {
            background: linear-gradient(135deg, #0F203D 0%, #0A1424 100%);
            padding: 22px;
            text-align: center;
            border-bottom: 4px solid #C5A880;
        }

        .header h1 {
            color: #FFFFFF;
            font-size: 22px;
            font-weight: 800;
        }

        .header p {
            color: #C5A880;
            font-size: 13px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* فورم الحجز السريع الخفيف والمحمي من الاختفاء */
        .booking-form {
            padding: 20px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 12px;
            color: #0F203D;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #0F203D;
            background-color: #FFFFFF;
        }

        .form-control:focus {
            outline: none;
            border-color: #C5A880;
        }

        /* الخدمات الإضافية لزيادة المبيعات والأرباح */
        .extra-services {
            background: #F8FAFC;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 14px;
            border: 1px solid #E2E8F0;
        }

        .extra-services-title {
            font-size: 11px;
            font-weight: 800;
            color: #1A365D;
            margin-bottom: 6px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .checkbox-btn {
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* صندوق ضرب ومنافسة أسعار بوكينج */
        .upsell-box {
            background: #F4EFE6;
            border: 1.5px dashed #C5A880;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .upsell-box input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #D32F2F;
        }

        .upsell-box label {
            font-size: 12px;
            font-weight: 700;
            color: #0F203D;
            line-height: 1.4;
            cursor: pointer;
        }

        .upsell-box label strong {
            color: #D32F2F;
        }

        /* زر الإرسال الرئيسي باللون الأحمر الملكي من الشعار */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #D32F2F 0%, #B71C1C 100%);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        .footer-text {
            text-align: center;
            padding: 12px;
            font-size: 11px;
            color: #64748B;
            background: #F8FAFC;
            border-top: 1px solid #E2E8F0;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <!-- هيدر الهوية الفاخرة لـ غراوي ترافل -->
    <div class="header">
        <h1>غراوي للسياحة والسفر</h1>
        <p>سفرك... بتخطيط يليق بك</p>
    </div>

    <!-- نموذج الحجز الصافي البسيط الآمن من الاختفاء تماماً -->
    <form class="booking-form" onsubmit="handleFormSubmit(event)">
        <div class="form-row">
            <div class="form-group">
                <label>من (المغادرة) *</label>
                <input type="text" id="departure" class="form-control" value="دمشق" required>
            </div>
            <div class="form-group">
                <label>إلى (الوجهة) *</label>
                <input type="text" id="destination" class="form-control" required placeholder="دبي، القاهرة..">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>تاريخ المغادرة *</label>
                <input type="date" id="departDate" class="form-control" required>
            </div>
            <div class="form-group">
                <label>تاريخ العودة (اختياري)</label>
                <input type="date" id="returnDate" class="form-control">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>الركاب *</label>
                <input type="number" id="passengers" class="form-control" value="1" min="1" required>
            </div>
            <div class="form-group">
                <label>درجة السفر</label>
                <select id="classType" class="form-control">
                    <option value="اقتصادية (Economy)">اقتصادية</option>
                    <option value="رجال أعمال (Business)">رجال أعمال</option>
                    <option value="درجة أولى (First Class)">درجة أولى</option>
                </select>
            </div>
        </div>

        <div class="extra-services">
            <div class="extra-services-title">خدمات إضافية مطلوبة:</div>
            <div class="checkbox-group">
                <label class="checkbox-btn"><input type="checkbox" id="srvVisa" value="تأشيرة فيزا"> تأشيرة دخول</label>
                <label class="checkbox-btn"><input type="checkbox" id="srvCar" value="سيارة خاصة"> استقبال مطار</label>
                <label class="checkbox-btn"><input type="checkbox" id="srvIns" value="تأمين سفر"> تأمين صحي</label>
            </div>
        </div>

        <div class="upsell-box">
            <input type="checkbox" id="hotelDiscount" checked>
            <label for="hotelDiscount">
                تفعيل **خصم غراوي الخاص للفنادق** 🏨 (ضمان أسعار منافسة لـ Booking.com وتوفير يصل إلى 15% لهذه الوجهة).
            </label>
        </div>

        <button type="submit" class="submit-btn">
            🟢 إرسال الطلب ومتابعة الحجز الفوري
        </button>
    </form>

    <div class="footer-text">
        غراوي ترافل &copy; 2026 - سفرك... بتخطيط يليق بك
    </div>
</div>

<script>
    // الأرقام الرسمية المعتمدة لمكتب غراوي ترافل
    const phonesList = ["963933535323", "963992211043"];

    window.onload = function() {
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('departDate').setAttribute('min', todayStr);
        document.getElementById('returnDate').setAttribute('min', todayStr);
    };

    function handleFormSubmit(event) {
        event.preventDefault();

        const selectedPhone = phonesList[Math.floor(Math.random() * phonesList.length)];

        const departure = document.getElementById('departure').value;
        const destination = document.getElementById('destination').value;
        const departDate = document.getElementById('departDate').value;
        const returnDate = document.getElementById('returnDate').value || "ذهاب فقط";
        const passengers = document.getElementById('passengers').value;
        const classType = document.getElementById('classType').value;
        
        let extras = [];
        if(document.getElementById('srvVisa').checked) extras.push("تأشيرة دخول 🎫");
        if(document.getElementById('srvCar').checked) extras.push("استقبال سيارة خاصة 🚗");
        if(document.getElementById('srvIns').checked) extras.push("تأمين صحي للسفر 🛡️");
        const extrasText = extras.length > 0 ? extras.join(' + ') : "لا يوجد خدمات إضافية";

        const hotelDiscount = document.getElementById('hotelDiscount').checked ? "نعم، أرسل لي عروض الفنادق الحصرية للمكاتب 🏨🔥" : "لا، طيران فقط";

        const message = `✨ *طلب حجز مبدئي جديد - غراوي ترافل* ✨%0A` +
                        `-----------------------------------%0A` +
                        `🛫 *محطة الانطلاق:* ${departure}%0A` +
                        `🛬 *وجهة الوصول:* ${destination}%0A` +
                        `📅 *تاريخ الذهاب:* ${departDate}%0A` +
                        `📅 *تاريخ العودة:* ${returnDate}%0A` +
                        `👥 *عدد المسافرين:* ${passengers} راكب%0A` +
                        `💺 *درجة السفر:* ${classType}%0A` +
