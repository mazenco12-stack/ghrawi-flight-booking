<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غراوي للسياحة والسفر | Ghrawi Travel & Tourism</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #0B192C;
            --secondary-navy: #1E3E62;
            --accent-gold: #D4AF37;
            --light-gold: #F4E0A5;
            --white: #FFFFFF;
            --gray-bg: #F8F9FA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--gray-bg);
            color: #333;
            line-height: 1.6;
            padding-bottom: 70px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-navy), var(--secondary-navy));
            color: var(--white);
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-area h1 {
            font-size: 22px;
            color: var(--accent-gold);
        }

        .contact-header a {
            color: var(--light-gold);
            text-decoration: none;
            font-weight: bold;
            margin-right: 15px;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #E0E0E0;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background-color: var(--primary-navy);
            border-bottom: 2px solid var(--accent-gold);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: none;
            border: none;
            color: var(--white);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--accent-gold);
            color: var(--primary-navy);
        }

        /* Form Styling */
        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: bold;
            color: var(--primary-navy);
            font-size: 14px;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 1px solid #CCC;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-gold), #B8860B);
            color: var(--primary-navy);
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            background-color: var(--primary-navy);
            color: var(--white);
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            border-top: 3px solid var(--accent-gold);
        }

        .footer-links a {
            color: var(--light-gold);
            text-decoration: none;
            margin: 0 10px;
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #25D366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.3s;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-earth-americas fa-2x" style="color: var(--accent-gold);"></i>
            <div>
                <h1>غراوي للسياحة والسفر</h1>
                <small style="color: var(--light-gold);">Ghrawi Travel & Tourism | Global Services</small>
            </div>
        </div>
        <div class="contact-header">
            <a href="https://wa.me/963933535323" target="_blank"><i class="fa-brands fa-whatsapp"></i> خدمة العملاء الدولية</a>
        </div>
    </header>

    <!-- Booking Interface -->
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('flights')"><i class="fa-solid fa-plane"></i> حجوزات طيران</button>
            <button class="tab-btn" onclick="openTab('hotels')"><i class="fa-solid fa-hotel"></i> حجوزات فنادق</button>
            <button class="tab-btn" onclick="openTab('cars')"><i class="fa-solid fa-car"></i> تأجير سيارات</button>
        </div>

        <!-- Flights Tab -->
        <div id="flights" class="tab-content active">
            <div class="form-grid">
                <div class="form-group">
                    <label>مدينة المغادرة</label>
                    <input type="text" id="flight-from" placeholder="مثال: دبي / إسطنبول / القاهرة">
                </div>
                <div class="form-group">
                    <label>وجهة الوصول</label>
                    <input type="text" id="flight-to" placeholder="مثال: لندن / باريس / أمين">
                </div>
                <div class="form-group">
                    <label>تاريخ السفر</label>
                    <input type="date" id="flight-date">
                </div>
                <div class="form-group">
                    <label>عدد المسافرين</label>
                    <select id="flight-passengers">
                        <option>1 بالغ</option>
                        <option>2 بالغين</option>
                        <option>عائلة (بالغين وأطفال)</option>
                    </select>
                </div>
            </div>
            <button class="submit-btn" onclick="bookFlight()"><i class="fa-brands fa-whatsapp"></i> احجز الطيران المباشر</button>
        </div>

        <!-- Hotels Tab -->
        <div id="hotels" class="tab-content">
            <div class="form-grid">
                <div class="form-group">
                    <label>المدينة أو الوجهة الفندقية</label>
                    <input type="text" id="hotel-city" placeholder="مثال: إسطنبول / دبي / كوالالمبور">
                </div>
                <div class="form-group">
                    <label>تاريخ الوصول</label>
                    <input type="date" id="hotel-checkin">
                </div>
                <div class="form-group">
                    <label>تاريخ المغادرة</label>
                    <input type="date" id="hotel-checkout">
                </div>
                <div class="form-group">
                    <label>نوع الإقامة</label>
                    <select id="hotel-rooms">
                        <option>غرفة مفردة / مزدوجة</option>
                        <option>جناح عائلي</option>
                        <option>منتجع فاخر</option>
                    </select>
                </div>
            </div>
            <button class="submit-btn" onclick="bookHotel()"><i class="fa-brands fa-whatsapp"></i> استفسر واحجز الفندق</button>
        </div>

        <!-- Cars Tab -->
        <div id="cars" class="tab-content">
            <div class="form-grid">
                <div class="form-group">
                    <label>مدينة الاستلام</label>
                    <input type="text" id="car-city" placeholder="ادخل اسم المدينة أو المطار">
                </div>
                <div class="form-group">
                    <label>تاريخ الاستلام</label>
                    <input type="date" id="car-date">
                </div>
                <div class="form-group">
                    <label>فئة السيارة</label>
                    <select id="car-type">
                        <option>اقتصادية</option>
                        <option>عائلية / SUV</option>
                        <option>فاخرة / VIP</option>
                    </select>
                </div>
            </div>
            <button class="submit-btn" onclick="bookCar()"><i class="fa-brands fa-whatsapp"></i> احجز السيارة الآن</button>
        </div>
    </div>

    <!-- Floating WhatsApp -->
    <a href="https://wa.me/963933535323" class="whatsapp-float" target="_blank" title="تواصل معنا عبر الواتساب">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Footer -->
    <footer>
        <p><strong>غراوي للسياحة والسفر</strong> | بوابتك الفاخرة لكل العالم</p>
        <p><i class="fa-solid fa-globe"></i> خدمات سياحة وحجوزات دولية حول العالم</p>
        <div class="footer-links" style="margin-top: 10px;">
            <a href="https://wa.me/963933535323" target="_blank"><i class="fa-brands fa-whatsapp"></i> +963 933 535 323</a> | 
            <a href="https://wa.me/963992211043" target="_blank"><i class="fa-brands fa-whatsapp"></i> +963 992 211 043</a>
        </div>
    </footer>

    <!-- Interactive JavaScript -->
    <script>
        function openTab(tabName) {
            const contents = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-btn');
            
            contents.forEach(content => content.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        const whatsappNumber = "963933535323";

        function bookFlight() {
            const from = document.getElementById('flight-from').value || "غير محدد";
            const to = document.getElementById('flight-to').value || "غير محدد";
            const date = document.getElementById('flight-date').value || "غير محدد";
            const passengers = document.getElementById('flight-passengers').value;

            const msg = `مرحباً غراوي للسياحة والسفر، أرغب بحجز طيران دولي:\n- المغادرة: ${from}\n- الوجهة: ${to}\n- التاريخ: ${date}\n- المسافرين: ${passengers}`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function bookHotel() {
            const city = document.getElementById('hotel-city').value || "غير محدد";
            const checkin = document.getElementById('hotel-checkin').value || "غير محدد";
            const checkout = document.getElementById('hotel-checkout').value || "غير محدد";
            const rooms = document.getElementById('hotel-rooms').value;

            const msg = `مرحباً غراوي للسياحة والسفر، أرغب بحجز فندق:\n- الوجهة: ${city}\n- الوصول: ${checkin}\n- المغادرة: ${checkout}\n- تفاصيل الإقامة: ${rooms}`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function bookCar() {
            const city = document.getElementById('car-city').value || "غير محدد";
            const date = document.getElementById('car-date').value || "غير محدد";
            const type = document.getElementById('car-type').value;

            const msg = `مرحباً غراوي للسياحة والسفر، أرغب بتأجير سيارة:\n- المدينة/المطار: ${city}\n- التاريخ: ${date}\n- الفئة: ${type}`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
