<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غراوي للسياحة والسفر | Ghrawi Travel</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0a192f;
            --accent: #d4af37;
            --light: #f8f9fa;
            --dark: #121212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #1e3c72);
            color: white;
            padding: 30px 20px 60px 20px;
            text-align: center;
            border-bottom: 4px solid var(--accent);
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .container {
            max-width: 950px;
            margin: -40px auto 40px auto;
            padding: 0 15px;
        }

        /* تبويبات على طريقة Booking */
        .booking-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 0;
            background: rgba(10, 25, 47, 0.9);
            padding: 10px 10px 0 10px;
            border-radius: 12px 12px 0 0;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: white;
            color: var(--primary);
        }

        .booking-box {
            background: white;
            padding: 30px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--primary);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        @media (max-width: 650px) {
            .form-row { flex-direction: column; gap: 0; }
        }

        .btn {
            background: var(--accent);
            color: var(--primary);
            padding: 14px 28px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover { background: #b89628; }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }

        .info-item i { color: var(--accent); font-size: 1.2rem; }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--primary);
            color: white;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>غراوي للسياحة والسفر</h1>
        <p>وجهتك الأولى لحجوزات الطيران، الفنادق، والسيارات حول العالم</p>
    </header>

    <div class="container">
        <!-- شريط التبويبات الرئيسي -->
        <div class="booking-tabs">
            <button class="tab-btn active" onclick="openTab(event, 'flights')"><i class="fas fa-plane"></i> طيران</button>
            <button class="tab-btn" onclick="openTab(event, 'hotels')"><i class="fas fa-hotel"></i> فنادق</button>
            <button class="tab-btn" onclick="openTab(event, 'cars')"><i class="fas fa-car"></i> تأجير سيارات</button>
        </div>

        <div class="booking-box">
            <!-- تبويب الطيران -->
            <div id="flights" class="tab-content active">
                <form onsubmit="event.preventDefault(); alert('تم استلام طلب حجز الطيران بنجاح!');">
                    <div class="form-row">
                        <div class="form-group">
                            <label>الاسم الكامل</label>
                            <input type="text" placeholder="الاسم كما في الجواز" required>
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف / الواتساب</label>
                            <input type="tel" placeholder="09xxxxxxxx" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>نوع الرحلة</label>
                        <div class="radio-group">
                            <label><input type="radio" name="ftype" checked> ذهاب فقط</label>
                            <label><input type="radio" name="ftype"> ذهاب وعودة</label>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>من</label><input type="text" placeholder="مدينة المغادرة" required></div>
                        <div class="form-group"><label>إلى</label><input type="text" placeholder="مدينة الوصول" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>تاريخ الذهاب</label><input type="date" required></div>
                        <div class="form-group"><label>تاريخ العودة</label><input type="date"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>عدد المسافرين</label><input type="number" min="1" value="1"></div>
                        <div class="form-group">
                            <label>درجة السفر</label>
                            <select><option>سياحية</option><option>رجال أعمال</option><option>درجة أولى</option></select>
                        </div>
                    </div>
                    <button type="submit" class="btn">بحث وطلب حجز طيران</button>
                </form>
            </div>

            <!-- تبويب الفنادق -->
            <div id="hotels" class="tab-content">
                <form onsubmit="event.preventDefault(); alert('تم استلام طلب حجز الفندق بنجاح!');">
                    <div class="form-row">
                        <div class="form-group"><label>الاسم الكامل</label><input type="text" required></div>
                        <div class="form-group"><label>رقم الواتساب</label><input type="tel" required></div>
                    </div>
                    <div class="form-group"><label>الوجهة / اسم الفندق أو المدينة</label><input type="text" placeholder="مثال: دبي، القاهرة..." required></div>
                    <div class="form-row">
                        <div class="form-group"><label>تاريخ الوصول</label><input type="date" required></div>
                        <div class="form-group"><label>تاريخ المغادرة</label><input type="date" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>عدد الغرف</label><input type="number" min="1" value="1"></div>
                        <div class="form-group"><label>عدد النزلاء</label><input type="number" min="1" value="2"></div>
                    </div>
                    <button type="submit" class="btn">بحث وطلب حجز فندقي</button>
                </form>
            </div>

            <!-- تبويب السيارات -->
            <div id="cars" class="tab-content">
                <form onsubmit="event.preventDefault(); alert('تم استلام طلب تأجير السيارة بنجاح!');">
                    <div class="form-row">
                        <div class="form-group"><label>الاسم الكامل</label><input type="text" required></div>
                        <div class="form-group"><label>رقم الواتساب</label><input type="tel" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>مكان الاستلام</label><input type="text" placeholder="المطار أو المدينة" required></div>
                        <div class="form-group"><label>نوع السيارة المفضلة</label><input type="text" placeholder="مثال: اقتصادية، SUV..."></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>تاريخ الاستلام</label><input type="date" required></div>
                        <div class="form-group"><label>تاريخ التسليم</label><input type="date" required></div>
                    </div>
                    <button type="submit" class="btn">طلب حجز سيارة</button>
                </form>
            </div>
        </div>

        <!-- معلومات التواصل -->
        <div class="card">
            <h3 style="color: var(--primary); margin-bottom: 10px;">تواصل معنا مباشرة</h3>
            <div class="contact-info">
                <div class="info-item"><i class="fas fa-map-marker-alt"></i><span>دمشق - شارع الحمراء</span></div>
                <div class="info-item"><i class="fas fa-phone"></i><span>0933535323 / 0992211043</span></div>
                <div class="info-item"><i class="fas fa-phone-alt"></i><span>أرضي: 3322679</span></div>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © غراوي للسياحة والسفر</p>
    </footer>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
