<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غراوي للسياحة والسفر - نظام الحجز الذكي</title>
    <!-- استيراد الخطوط والأيقونات والمكتبات الفاخرة -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --navy-blue: #0F203D; /* أزرق نيفي ملكي داكن */
            --navy-light: #1A365D;
            --gold: #C5A880; /* ذهبي فاخر */
            --gold-light: #F4EFE6;
            --crimson-red: #D32F2F; /* الأحمر الديناميكي من الشعار */
            --white: #FFFFFF;
            --gray-light: #F8FAFC;
            --text-main: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0B132B;
            background-image: radial-gradient(at 0% 0%, hsla(223,83%,18%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(218,63%,12%,1) 0, transparent 50%);
            color: var(--text-main);
            padding: 30px 10px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .booking-container {
            width: 100%;
            max-width: 520px;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 2px solid var(--gold);
        }

        /* الهيدر الفخم */
        .header {
            background: linear-gradient(135deg, var(--navy-blue) 0%, #050B14 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid var(--gold);
            position: relative;
        }

        .logo-placeholder {
            width: 140px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0px 6px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .logo-placeholder:hover {
            transform: scale(1.05);
        }

        .header h1 {
            color: var(--white);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header p {
            color: var(--gold);
            font-size: 14px;
            margin-top: 6px;
            font-weight: 600;
        }

        /* شريط التقدّم التفاعلي لراحة العميل النفسية */
        .progress-container {
            background: var(--gray-light);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #E2E8F0;
        }

        .progress-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--navy-light);
        }

        .progress-bar-bg {
            width: 60%;
            height: 6px;
            background: #E2E8F0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 15%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold) 0%, var(--crimson-red) 100%);
            transition: width 0.4s ease;
        }

        /* فورم الحجز */
        .booking-form {
            padding: 25px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--navy-blue);
        }

        .form-group label span {
            color: var(--crimson-red);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 16px;
            transition: color 0.3s;
        }

        .form-control {
            width: 100%;
            padding: 13px 42px 13px 15px;
            border: 1.5px solid #CBD5E1;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            color: var(--navy-blue);
            background-color: var(--white);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--navy-blue);
            box-shadow: 0 0 0 3px rgba(15, 32, 61, 0.1);
        }

        .form-control:focus + i {
            color: var(--crimson-red);
        }

        /* الحقول التسويقية الإضافية لزيادة المبيعات */
        .extra-services {
            background: var(--gray-light);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid #E2E8F0;
        }

        .extra-services-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--navy-light);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-btn {
            background: var(--white);
            border: 1px solid #CBD5E1;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .checkbox-btn input {
            accent-color: var(--crimson-red);
        }

        .checkbox-btn:has(input:checked) {
            border-color: var(--crimson-red);
            background: #FFEBEE;
            color: var(--crimson-red);
        }

        /* صندوق ضرب أسعار بوكينج للمنافسة الشرسة */
        .upsell-box {
            background: var(--gold-light);
            border: 1.5px dashed var(--gold);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(197, 168, 128, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(197, 168, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(197, 168, 128, 0); }
        }

        .upsell-box input[type="checkbox"] {
            margin-top: 4px;
            accent-color: var(--crimson-red);
            width: 18px;
            height: 18px;
        }

        .upsell-box label {
            font-size: 13px;
            font-weight: 700;
            color: var(--navy-blue);
            line-height: 1.6;
            cursor: pointer;
        }

        .upsell-box label strong {
            color: var(--crimson-red);
        }

        /* زر الإرسال الرئيسي المتفجر والجاذب */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--crimson-red) 0%, #B71C1C 100%);
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(211, 47, 47, 0.5);
        }

        /* خيار المساعدة السريع المدمج لمنع تشتيت الزبون */
        .quick-help {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
        }

        .quick-help a {
            color: var(--navy-light);
            text-decoration: none;
            border-bottom: 1px dashed var(--navy-light);
        }

        .footer-text {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #64748B;
            background: var(--gray-light);
            border-top: 1px solid #E2E8F0;
            font-weight: 600;
        }

        /* شاشة التأكيد المنبثقة قبل التحويل الفوري للواتساب للفخامة */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 43, 0.8);
            z-index: 1000;
            align-items: center; justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            border: 2px solid var(--gold);
        }

        .modal-content i {
            font-size: 50px;
            color: #2E7D32;
            margin-bottom: 15px;
        }

        .modal-content h3 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--navy-blue);
        }
    </style>
</head>
<body>

<div class="booking-container">
    <!-- هيدر الهوية الفاخرة لـ غراوي ترافل -->
    <div class="header">
