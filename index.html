<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غراوي للسياحة والسفر</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#10233f}
header{background:#0b192c;color:white;padding:22px 16px;text-align:center}
.logo{font-size:28px;font-weight:bold;color:#fff}.logo b{color:#d4af37}
header p{margin:7px 0 0;color:#d9e0e8}
.hero{padding:45px 18px;text-align:center;background:linear-gradient(135deg,#0b192c,#1e3e62);color:white}
.hero h1{font-size:32px;margin:0 0 12px}.hero p{font-size:17px;line-height:1.8}
.card{max-width:850px;margin:-20px auto 30px;background:white;border-radius:20px;padding:20px;box-shadow:0 10px 35px #0002}
.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;border:0;padding:14px;border-radius:12px;background:#edf1f5;color:#10233f;font-weight:bold;cursor:pointer}.tabs .active{background:#0b192c;color:white}
form{display:grid;gap:12px}label{font-weight:bold;font-size:14px}input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.submit{border:0;padding:15px;border-radius:12px;background:#b99635;color:white;font-size:17px;font-weight:bold;cursor:pointer}
.whatsapp{display:block;text-align:center;margin-top:12px;padding:13px;border-radius:12px;background:#25d366;color:white;text-decoration:none;font-weight:bold}
section{max-width:850px;margin:30px auto;padding:0 18px;text-align:center}section h2{color:#0b192c}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service{background:white;padding:22px 10px;border-radius:15px;box-shadow:0 4px 18px #0001}.service strong{display:block;margin-top:8px}
footer{margin-top:40px;background:#0b192c;color:white;text-align:center;padding:25px 15px}
@media(max-width:600px){.row,.services{grid-template-columns:1fr}.hero h1{font-size:26px}.card{margin:0 12px 25px}.tabs button{font-size:13px;padding:12px}}
</style>
</head>

<body>

<header>
<div class="logo">GHRAWI <b>Travel</b></div>
<p>غراوي للسياحة والسفر</p>
</header>

<div class="hero">
<h1>سفرك يبدأ من هنا ✈️</h1>
<p>نساعدك في اختيار الرحلات والفنادق والخدمات السياحية المناسبة لاحتياجاتك.</p>
</div>

<div class="card">

<div class="tabs">
<button class="active" onclick="show('flight',this)">✈️ طيران</button>
<button onclick="show('hotel',this)">🏨 فنادق</button>
<button onclick="show('car',this)">🚘 سيارات</button>
</div>

<form id="flight">
<div class="row">
<div><label>من</label><input id="from" placeholder="دمشق"></div>
<div><label>إلى</label><input id="to" placeholder="دبي"></div>
</div>
<div class="row">
<div><label>تاريخ السفر</label><input id="date" type="date"></div>
<div><label>عدد المسافرين</label><input id="people" type="number" value="1" min="1"></div>
</div>
<button class="submit" type="button" onclick="book('flight')">طلب حجز الرحلة</button>
</form>

<form id="hotel" style="display:none">
<label>المدينة</label><input id="city" placeholder="دبي">
<div class="row">
<div><label>تسجيل الدخول</label><input id="checkin" type="date"></div>
<div><label>تسجيل الخروج</label><input id="checkout" type="date"></div>
</div>
<label>نوع الغرفة</label><select id="room"><option>غرفة مفردة</option><option>غرفة مزدوجة</option><option>جناح</option></select>
<button class="submit" type="button" onclick="book('hotel')">طلب حجز الفندق</button>
</form>

<form id="car" style="display:none">
<label>المدينة</label><input id="carcity" placeholder="دمشق">
<div class="row">
<div><label>التاريخ</label><input id="cardate" type="date"></div>
<div><label>نوع السيارة</label><select id="cartype"><option>اقتصادية</option><option>VIP</option><option>عائلية</option></select></div>
</div>
<button class="submit" type="button" onclick="book('car')">طلب سيارة</button>
</form>

<a class="whatsapp" href="https://wa.me/963933535323" target="_blank" rel="noopener">💬 تواصل معنا عبر واتساب</a>
</div>

<section>
<h2>خدمات غراوي</h2>
<div class="services">
<div class="service">✈️<strong>حجوزات الطيران</strong></div>
<div class="service">🏨<strong>حجوزات الفنادق</strong></div>
<div class="service">🚘<strong>خدمات النقل</strong></div>
</div>
</section>

<footer>
<strong>غراوي للسياحة والسفر</strong>
<p>Ghrawi Travel & Tourism</p>
</footer>

<script>
function show(id,btn){
document.querySelectorAll('form').forEach(x=>x.style.display='none');
document.getElementById(id).style.display='grid';
document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
}
function book(type){
let msg='';
if(type==='flight')msg='مرحباً غراوي للسياحة والسفر، أريد طلب حجز طيران من '+from.value+' إلى '+to.value+' بتاريخ '+date.value+' لعدد '+people.value+' مسافر.';
if(type==='hotel')msg='مرحباً غراوي، أريد حجز فندق في '+city.value+' من '+checkin.value+' إلى '+checkout.value+'، نوع الغرفة: '+room.value+'.';
if(type==='car')msg='مرحباً غراوي، أريد سيارة في '+carcity.value+' بتاريخ '+cardate.value+'، النوع: '+cartype.value+'.';
window.open('https://wa.me/963933535323?text='+encodeURIComponent(msg),'_blank');
}
</script>

</body>
</html>
