<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غراوي للسياحة والسفر | Ghrawi Travel & Tourism</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0a192f;
            --accent: #d4af37;
            --light: #f8f9fa;
            --dark: #121212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #1e3c72);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 4px solid var(--accent);
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn {
            background: var(--accent);
            color: var(--primary);
            padding: 14px 28px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn:hover {
            background: #b89628;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
        }

        .info-item i {
            color: var(--accent);
            font-size: 1.3rem;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--primary);
            color: white;
            margin-top: 40px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>غراوي للسياحة والسفر</h1>
        <p>Ghrawi Travel & Tourism | حجز تذاكر طيران ورحلات سياحية بأفضل الأسعار</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>طلب حجز تذكرة طيران</h2>
            <form onsubmit="event.preventDefault(); alert('تم استلام طلبك بنجاح، سنتواصل معك قريباً!');">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" placeholder="أدخل اسمك الكامل" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف / الواتساب</label>
                    <input type="tel" placeholder="09xxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label>وجهة السفر (من - إلى)</label>
                    <input type="text" placeholder="مثال: دمشق - دبي" required>
                </div>
                <div class="form-group">
                    <label>تاريخ السفر المقترح</label>
                    <input type="date" required>
                </div>
                <button type="submit" class="btn">إرسال طلب الحجز</button>
            </form>
        </div>

        <div class="card">
            <h2>تواصل معنا</h2>
            <div class="contact-info">
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>دمشق - شارع الحمراء</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <span>0933535323 / 0992211043</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone-alt"></i>
                    <span>هاتف أرضي: 3322679</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © غراوي للسياحة والسفر</p>
    </footer>

</body>
</html>
