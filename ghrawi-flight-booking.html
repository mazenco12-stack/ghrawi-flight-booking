<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غراوي للسياحة والسفر — طلب حجز طيران</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7FA;
    --bg-elevated: #FFFFFF;
    --ink: #0F2140;
    --ink-soft: #55647E;
    --primary: #14275A;
    --primary-dark: #0A1733;
    --accent: #C8202E;
    --accent-soft: #F3C2C6;
    --line: #DBE1EC;
    --danger: #C8202E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1733;
      --bg-elevated: #132449;
      --ink: #F2F5FA;
      --ink-soft: #AAB6CC;
      --primary: #5B84D6;
      --primary-dark: #8FAEE8;
      --accent: #E85C67;
      --accent-soft: #4A2530;
      --line: #22335C;
      --danger: #E85C67;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1733;
    --bg-elevated: #132449;
    --ink: #F2F5FA;
    --ink-soft: #AAB6CC;
    --primary: #5B84D6;
    --primary-dark: #8FAEE8;
    --accent: #E85C67;
    --accent-soft: #4A2530;
    --line: #22335C;
    --danger: #E85C67;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* --- Header / hero --- */
  header.hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, var(--primary-dark), var(--primary));
    color: #FFFFFF;
    padding: 40px 20px 56px;
    border-radius: 0 0 28px 28px;
    border-bottom: 4px solid var(--accent);
  }
  .mosaic {
    position: absolute;
    inset: 0;
    opacity: 0.16;
    pointer-events: none;
  }
  .hero-inner {
    position: relative;
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
  }
  .logo-img {
    width: 84px;
    height: 84px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #FFFFFF;
    box-shadow: 0 0 0 3px var(--accent);
    background: #fff;
    margin-bottom: 14px;
  }
  .brand-mark {
    font-family: "Amiri", serif;
    font-size: 15px;
    letter-spacing: 0.5px;
    color: #FF8A92;
    margin-bottom: 6px;
    font-weight: 700;
  }
  h1.brand-title {
    font-family: "Amiri", serif;
    font-weight: 700;
    font-size: clamp(30px, 7vw, 42px);
    margin: 0 0 12px;
  }
  .hero-sub {
    font-size: 16px;
    color: #D7E0F5;
    max-width: 420px;
    margin: 0 auto;
  }

  /* --- Card / form --- */
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 20px;
    margin-top: -34px;
    padding: 26px 22px 28px;
    box-shadow: 0 18px 40px -22px rgba(0,0,0,0.35);
  }

  .segmented {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .segmented label {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    border-radius: 9px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-soft);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .segmented input { display: none; }
  .segmented input:checked + label {
    background: var(--primary);
    color: #FBF6E8;
  }

  .field {
    margin-bottom: 16px;
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  label.field-label {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  input, select, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15.5px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 12px 13px;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
  textarea { resize: vertical; min-height: 64px; }

  .swap-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 8px;
  }
  .swap-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--primary);
    font-size: 17px;
    cursor: pointer;
    margin-bottom: 1px;
  }

  #return-field { display: none; }

  .submit-btn {
    width: 100%;
    margin-top: 6px;
    background: var(--accent);
    color: #FFFFFF;
    font-weight: 800;
    font-size: 16.5px;
    border: none;
    border-radius: 13px;
    padding: 15px;
    cursor: pointer;
    box-shadow: 0 10px 22px -10px rgba(200,32,46,0.55);
  }
  .submit-btn:active { transform: translateY(1px); }

  .hint {
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 10px;
  }

  .error-box {
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 13.5px;
    font-weight: 700;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 14px;
    display: none;
  }

  /* --- contact strip --- */
  .contact-strip {
    margin-top: 22px;
    display: flex;
    gap: 10px;
  }
  .contact-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px;
    border-radius: 12px;
    border: 1.5px solid var(--primary);
    background: var(--bg-elevated);
    color: var(--primary);
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
  }

  footer {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 30px;
  }

  @media (max-width: 380px) {
    .field-row { grid-template-columns: 1fr; }
  }
</style>
</head>

      <div class="brand-mark">غراوي للسياحة والسفر</div>
      <h1 class="brand-title">إلى أين تحبّ أن تسافر؟</h1>
      <p class="hero-sub">أرسل تفاصيل رحلتك، ويتواصل معك فريقنا خلال دقائق بأفضل الأسعار والمواعيد المتاحة.</p>
    </div>
  </header>

  <main class="card">
    <div class="error-box" id="errorBox"></div>

    <div class="segmented">
      <input type="radio" name="tripType" id="oneway" value="oneway">
      <label for="oneway">ذهاب فقط</label>
      <input type="radio" name="tripType" id="roundtrip" value="roundtrip" checked>
      <label for="roundtrip">ذهاب وعودة</label>
    </div>

    <form id="bookingForm">
      <div class="swap-row">
        <div class="field" style="margin-bottom:0">
          <label class="field-label" for="from">من</label>
          <input type="text" id="from" placeholder="دمشق" required>
        </div>
        <button type="button" class="swap-btn" id="swapBtn" title="تبديل" aria-label="تبديل الوجهتين">⇄</button>
        <div class="field" style="margin-bottom:0">
          <label class="field-label" for="to">إلى</label>
          <input type="text" id="to" placeholder="اسطنبول" required>
        </div>
      </div>

      <div class="field-row" style="margin-top:16px">
        <div class="field">
          <label class="field-label" for="depart">تاريخ المغادرة</label>
          <input type="date" id="depart" required>
        </div>
        <div class="field" id="return-field">
          <label class="field-label" for="returnDate">تاريخ العودة</label>
          <input type="date" id="returnDate">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="pax">عدد المسافرين</label>
          <input type="number" id="pax" min="1" value="1" required>
        </div>
        <div class="field">
          <label class="field-label" for="cabin">الدرجة</label>
          <select id="cabin">
            <option value="اقتصادية">اقتصادية</option>
            <option value="رجال أعمال">رجال أعمال</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="name">الاسم الكامل</label>
        <input type="text" id="name" required>
      </div>

      <div class="field">
        <label class="field-label" for="phone">رقم الهاتف / واتساب</label>
        <input type="tel" id="phone" placeholder="09xxxxxxxx" required>
      </div>

      <div class="field" style="margin-bottom:6px">
        <label class="field-label" for="notes">ملاحظات (اختياري)</label>
        <textarea id="notes" placeholder="أي تفضيلات إضافية: موعد محدد، شركة طيران، إلخ"></textarea>
      </div>

      <button type="submit" class="submit-btn">إرسال الطلب عبر واتساب</button>
      <p class="hint">سيتم فتح واتساب برسالة جاهزة تحتوي كل تفاصيل رحلتك</p>
    </form>

    <div class="contact-strip">
      <a class="contact-btn" href="tel:+963933535323">📞 0933 535 323</a>
      <a class="contact-btn" href="tel:+963992211043">📞 0992 211 043</a>
    </div>
    <div class="contact-strip">
      <a class="contact-btn" id="waBtn" href="https://wa.me/963933535323" target="_blank" rel="noopener" style="background:var(--primary);color:#FBF6E8;border-color:var(--primary);">💬 تواصل عبر واتساب</a>
    </div>
  </main>

  <footer>غراوي للسياحة والسفر — دمشق، سوريا</footer>
</div>

<script>
  const AGENCY_PHONE = "963933535323"; // 0933 535 323

  const roundtripRadio = document.getElementById('roundtrip');
  const onewayRadio = document.getElementById('oneway');
  const returnField = document.getElementById('return-field');
  const returnInput = document.getElementById('returnDate');

  function syncTripType() {
    if (roundtripRadio.checked) {
      returnField.style.display = 'block';
      returnInput.required = true;
    } else {
      returnField.style.display = 'none';
      returnInput.required = false;
      returnInput.value = '';
    }
  }
  roundtripRadio.addEventListener('change', syncTripType);
  onewayRadio.addEventListener('change', syncTripType);
  syncTripType();

  document.getElementById('swapBtn').addEventListener('click', () => {
    const fromEl = document.getElementById('from');
    const toEl = document.getElementById('to');
    const tmp = fromEl.value;
    fromEl.value = toEl.value;
    toEl.value = tmp;
  });

  const errorBox = document.getElementById('errorBox');

  document.getElementById('bookingForm').addEventListener('submit', function (e) {
    e.preventDefault();
    errorBox.style.display = 'none';

    const from = document.getElementById('from').value.trim();
    const to = document.getElementById('to').value.trim();
    const depart = document.getElementById('depart').value;
    const isRoundtrip = roundtripRadio.checked;
    const returnDate = returnInput.value;
    const pax = document.getElementById('pax').value;
    const cabin = document.getElementById('cabin').value;
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const notes = document.getElementById('notes').value.trim();

    if (!from || !to || !depart || !pax || !name || !phone || (isRoundtrip && !returnDate)) {
      errorBox.textContent = 'الرجاء تعبئة جميع الحقول المطلوبة قبل الإرسال.';
      errorBox.style.display = 'block';
      errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    const lines = [
      'طلب حجز طيران جديد — غراوي للسياحة والسفر',
      '',
      '✈️ من: ' + from,
      '🛬 إلى: ' + to,
      '📅 تاريخ المغادرة: ' + depart,
      isRoundtrip ? ('📅 تاريخ العودة: ' + returnDate) : '📅 نوع الرحلة: ذهاب فقط',
      '👥 عدد المسافرين: ' + pax,
      '💺 الدرجة: ' + cabin,
      '🙍 الاسم: ' + name,
      '📱 الهاتف: ' + phone,
    ];
    if (notes) lines.push('📝 ملاحظات: ' + notes);

    const message = lines.join('\n');
    const url = 'https://wa.me/' + AGENCY_PHONE + '?text=' + encodeURIComponent(message);
    window.open(url, '_blank');
  });
</script>
</body>
